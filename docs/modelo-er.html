<rect x="380" y="70" width="260" height="170" rx="10" fill="#fff" stroke="#2B8A3E" stroke-width="2"/><rect x="380" y="70" width="260" height="34" rx="10" fill="#2B8A3E"/><text x="510" y="93" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">CONTACTOS</text>

<rect x="680" y="310" width="260" height="56" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.2"/><text x="810" y="330" font-size="11" text-anchor="middle" fill="#a61e4d">muchas filas: incidentes y check-ins</text>

<text x="40" y="390" font-size="13" font-weight="bold">Relación con el resto de la app</text>
<rect x="40" y="410" width="900" height="140" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/><text x="60" y="438" font-size="12">· Mapa: lee REPORTES y dibuja un marcador por fila (latitud, longitud), agrupados por tipo.</text>
<text x="60" y="460" font-size="12">· ruta_foto: apunta a .jpg en Android/data/com.example.redsos/files/Pictures/</text>
<text x="60" y="482" font-size="12">· Pantalla Contactos: lee CONTACTOS con RecyclerView.</text>
<text x="60" y="504" font-size="12">· sincronizado: marca qué filas faltan por mandar al servidor.</text>

<text x="40" y="570" font-size="13" font-weight="bold">Operaciones CRUD (clase RedSOSDb)</text>
<rect x="40" y="590" width="200" height="130" rx="8" fill="#eaf5ec" stroke="#2B8A3E"/><text x="140" y="618" font-size="12" font-weight="bold" text-anchor="middle" fill="#1B7A2E">CREATE</text><text x="140" y="640" font-size="11" text-anchor="middle">insertarContacto()</text><text x="140" y="660" font-size="11" text-anchor="middle">guardarPerfil()</text><text x="140" y="680" font-size="11" text-anchor="middle">insertarReporte()</text><text x="140" y="700" font-size="10" text-anchor="middle" fill="#868e96">con ContentValues</text>

<rect x="260" y="590" width="200" height="130" rx="8" fill="#e7f0fb" stroke="#1864ab"/><text x="360" y="618" font-size="12" font-weight="bold" text-anchor="middle" fill="#1864ab">READ</text><text x="360" y="640" font-size="11" text-anchor="middle">obtenerTodosContactos()</text><text x="360" y="660" font-size="11" text-anchor="middle">obtenerPerfil()</text><text x="360" y="680" font-size="11" text-anchor="middle">obtenerTodosReportes()</text><text x="360" y="700" font-size="10" text-anchor="middle" fill="#868e96">con Cursor</text>

<rect x="480" y="590" width="200" height="130" rx="8" fill="#fff4e6" stroke="#E67700"/><text x="580" y="618" font-size="12" font-weight="bold" text-anchor="middle" fill="#E67700">UPDATE</text><text x="580" y="640" font-size="11" text-anchor="middle">actualizarContacto()</text><text x="580" y="660" font-size="11" text-anchor="middle">marcarContactoSincronizado()</text><text x="580" y="680" font-size="11" text-anchor="middle">marcarReporteSincronizado()</text><text x="580" y="700" font-size="10" text-anchor="middle" fill="#868e96">selectionArgs: "_ID = ?"</text>
